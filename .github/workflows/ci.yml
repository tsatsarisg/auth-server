name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter auth-server run lint

      - name: Format check
        run: pnpm --filter auth-server run format:check

      - name: Typecheck
        run: pnpm --filter auth-server run typecheck

      - name: Unit tests
        run: pnpm --filter auth-server run test

      - name: End-to-end tests
        run: pnpm --filter auth-server run test:e2e

      - name: Build
        run: pnpm --filter auth-server run build
